<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Welcome</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #121212;
      overflow: hidden;
    }
    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(108,92,231,0.35) 0%, rgba(108,92,231,0) 70%);
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .wrap {
      max-width: 340px;
      position: relative;
      z-index: 1;
    }
    .logo-img {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 22px;
      box-shadow: 0 0 30px rgba(108,92,231,0.5);
      display: block;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.3px;
      margin: 0 0 12px;
    }
    .highlight {
      background: linear-gradient(135deg, #8B7CF0, #6C5CE7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.subtext {
      color: #B8B8B8;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 40px;
    }
    .primary-btn {
      width: 100%;
      height: 54px;
      background: #6C5CE7;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(108,92,231,0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .primary-btn:active {
      transform: scale(0.98);
      filter: brightness(0.92);
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <img src="logo.png" alt="Retropia" class="logo-img">
    <h1>Welcome to Retropia, <span class="highlight" id="user-name">friend</span>.</h1>
    <p class="subtext">Ready to see yourself across every era?</p>
    <button class="primary-btn" onclick="startJourney()">Create My Era Journey</button>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    if (localStorage.getItem('retropia_onboarded')) {
      window.location.href = 'upload.html';
    }

    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        const name = user.user_metadata?.name || user.email?.split('@')[0];
        if (name) document.getElementById('user-name').innerText = name;
      }
    })();

    function startJourney() {
      localStorage.setItem('retropia_onboarded', 'true');
      window.location.href = 'upload.html';
    }
  </script>
</body>
</html>
