<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Profile</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      min-height: 100vh;
    }
    body { padding: 20px 20px 100px; }

    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: #1C1C1C;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
    }
    .header h1 { font-size: 20px; font-weight: 600; margin: 0; }

    /* Identity card */
    .identity-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1C1C1C;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .identity-card img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
    .identity-name { font-size: 16px; font-weight: 700; }
    .identity-email { font-size: 13px; color: #777; margin-top: 2px; }

    /* Section */
    .section { margin-bottom: 24px; }
    .section-title { font-size: 13px; font-weight: 700; color: #777; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .row-card {
      background: #1C1C1C;
      border-radius: 14px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #2A2A2A;
    }
    .row:last-child { border-bottom: none; }
    .row-label { font-size: 14px; font-weight: 500; }
    .row-value { font-size: 13px; color: #B8B8B8; }
    .plan-pill {
      font-size: 12px;
      font-weight: 700;
      color: #B8A9F5;
      background: rgba(108,92,231,0.15);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Toggle */
    .toggle {
      width: 44px; height: 26px;
      background: #2A2A2A;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle.on { background: #6C5CE7; }
    .toggle-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }
    .toggle.on .toggle-knob { transform: translateX(18px); }

    /* Feedback form */
    .feedback-form {
      background: #1C1C1C;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .feedback-form select,
    .feedback-form textarea,
    .feedback-form input {
      width: 100%;
      background: #121212;
      border: 1px solid #2A2A2A;
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }
    .feedback-form textarea { min-height: 80px; resize: vertical; }
    .feedback-submit {
      background: #6C5CE7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .feedback-status { font-size: 13px; text-align: center; min-height: 16px; }
    .feedback-status.success { color: #35C98A; }
    .feedback-status.error { color: #EF5B5B; }

    /* Buttons */
    .action-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #1C1C1C;
      border: 1px solid #2A2A2A;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .logout-btn { color: #EF5B5B; border-color: rgba(239,91,91,0.3); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #161616;
      border-top: 1px solid #232323;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 74px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: #666;
      font-size: 11px;
      flex: 1;
    }
    .nav-item.active { color: #6C5CE7; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="dashboard.html" class="back-btn">&larr;</a>
    <h1>Profile</h1>
  </div>

  <div class="identity-card">
    <img src="logo.png" alt="Retropia">
    <div>
      <div class="identity-name" id="profile-name">...</div>
      <div class="identity-email" id="profile-email">...</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Account</div>
    <div class="row-card">
      <div class="row">
        <div class="row-label">Plan</div>
        <div class="plan-pill">Free</div>
      </div>
      <div class="row">
        <div class="row-label">Daily journeys used</div>
        <div class="row-value" id="daily-count">0 / 1</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Notifications</div>
    <div class="row-card">
      <div class="row">
        <div class="row-label">Journey ready alerts</div>
        <div class="toggle on" onclick="this.classList.toggle('on')"><div class="toggle-knob"></div></div>
      </div>
      <div class="row">
        <div class="row-label">Product updates</div>
        <div class="toggle" onclick="this.classList.toggle('on')"><div class="toggle-knob"></div></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Feedback</div>
    <form class="feedback-form" id="feedback-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <select name="category" required>
        <option value="">Select category</option>
        <option value="Bug">Bug</option>
        <option value="Feature Request">Feature Request</option>
        <option value="Other">Other</option>
      </select>
      <textarea name="message" placeholder="Tell us what's on your mind..." required></textarea>
      <button type="submit" class="feedback-submit">Send Feedback</button>
      <div class="feedback-status" id="feedback-status"></div>
    </form>
  </div>

  <button class="action-btn" onclick="installApp()">Install App</button>
  <button class="action-btn logout-btn" onclick="handleLogout()">Logout</button>

  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <div class="nav-icon">🏠</div>
      Home
    </a>
    <a href="creations.html" class="nav-item">
      <div class="nav-icon">🎞️</div>
      Creations
    </a>
    <a href="upload.html" class="nav-item">
      <div class="nav-icon">➕</div>
      Create
    </a>
    <a href="profile.html" class="nav-item active">
      <div class="nav-icon">👤</div>
      Profile
    </a>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'there';
      document.getElementById('profile-name').innerText = name;
      document.getElementById('profile-email').innerText = user.email;

      const today = new Date().toISOString().split('T')[0];
      const { data: dailyRow } = await supabaseClient
        .from('daily_generations')
        .select('count')
        .eq('user_id', user.id)
        .eq('date', today)
        .maybeSingle();
      document.getElementById('daily-count').innerText = `${dailyRow?.count || 0} / 1`;
    })();

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });
    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      } else {
        alert('To install: use your browser menu and select "Add to Home Screen".');
      }
    }

    document.getElementById('feedback-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const statusEl = document.getElementById('feedback-status');
      statusEl.innerText = 'Sending...';
      statusEl.className = 'feedback-status';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          statusEl.className = 'feedback-status success';
          statusEl.innerText = 'Thanks! Feedback sent.';
          form.reset();
        } else {
          statusEl.className = 'feedback-status error';
          statusEl.innerText = 'Something went wrong. Try again.';
        }
      } catch (err) {
        statusEl.className = 'feedback-status error';
        statusEl.innerText = 'Something went wrong. Try again.';
      }
    });
  </script>
</body>
</html>
