<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Creating Your Journey</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(108,92,231,0.28) 0%, rgba(108,92,231,0) 70%);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } }

    .loader {
      width: 64px; height: 64px;
      border: 4px solid #2A2A2A;
      border-top-color: #6C5CE7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; position: relative; z-index: 1; }
    .status-msg { font-size: 15px; color: #B8B8B8; min-height: 20px; position: relative; z-index: 1; transition: opacity 0.3s ease; }

    .progress-track {
      width: 220px;
      height: 6px;
      background: #292929;
      border-radius: 10px;
      margin-top: 24px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .progress-fill {
      height: 100%;
      width: 30%;
      background: #6C5CE7;
      border-radius: 10px;
      animation: indeterminate 1.6s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%); width: 40%; }
      50% { width: 60%; }
      100% { transform: translateX(250%); width: 40%; }
    }

    .sub-note { font-size: 13px; color: #666; margin-top: 20px; position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="loader"></div>
  <h1>Creating your journey</h1>
  <div class="status-msg" id="status-msg">Preparing your photos...</div>
  <div class="progress-track"><div class="progress-fill"></div></div>
  <div class="sub-note">This can take up to a minute or two.</div>

  <script src="supabase-client.js"></script>
  <script>
    const messages = [
      "Preparing your photos...",
      "Traveling through the eras...",
      "Mixing cinematic energy...",
      "Creating your transitions...",
      "Finishing your journey..."
    ];
    let msgIndex = 0;
    const statusEl = document.getElementById('status-msg');
    const rotateInterval = setInterval(() => {
      msgIndex = (msgIndex + 1) % messages.length;
      statusEl.style.opacity = 0;
      setTimeout(() => {
        statusEl.innerText = messages[msgIndex];
        statusEl.style.opacity = 1;
      }, 300);
    }, 3500);

    const themeNames = {
      'time-traveler': 'transform this person into 1920s vintage sepia photograph style, cinematic portrait, keep facial features',
      'heros-journey': 'transform this person into a heroic warrior figure, epic cinematic portrait, keep facial features',
      'romantic': 'transform this person into elegant romantic vintage fashion, cinematic portrait, keep facial features',
      'rebel': 'transform this person into edgy 1980s punk rebel fashion, cinematic portrait, keep facial features',
      'royal': 'transform this person into medieval royalty with ornate crown and robes, cinematic portrait, keep facial features',
      'genius': 'transform this person into a Victorian era inventor/scientist, cinematic portrait, keep facial features',
      'explorer': 'transform this person into an adventurous explorer in vintage expedition gear, cinematic portrait, keep facial features',
      'artist': 'transform this person into a renaissance-era painter, cinematic portrait, keep facial features',
      'celebrity': 'transform this person into a glamorous classic Hollywood celebrity, cinematic portrait, keep facial features',
      'spirit': 'transform this person into a mystical ancient spiritual figure, cinematic portrait, keep facial features'
    };

    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }

      const theme = sessionStorage.getItem('retropia_selected_journey');
      if (!theme) {
        window.location.href = 'journey.html';
        return;
      }

      const selfiePathsRaw = sessionStorage.getItem('retropia_selfie_paths');
      const selfiePaths = selfiePathsRaw ? JSON.parse(selfiePathsRaw) : [];

      if (!selfiePaths || selfiePaths.length === 0) {
        window.location.href = 'upload.html';
        return;
      }

      const prompt = themeNames[theme] || 'a cinematic portrait across different eras';

      async function tryGenerate(selfieUrl) {
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=kontext&image=${encodeURIComponent(selfieUrl)}`;
        return new Promise((resolve, reject) => {
          const img = new Image();
          const timeout = setTimeout(() => reject(new Error('timeout')), 90000);
          img.onload = () => { clearTimeout(timeout); resolve(imageUrl); };
          img.onerror = () => { clearTimeout(timeout); reject(new Error('load failed')); };
          img.src = imageUrl;
        });
      }

      try {
        // Get a temporary signed URL for the first selfie so Pollinations can fetch it
        const { data: signedData, error: signError } = await supabaseClient.storage
          .from('Selfies')
          .createSignedUrl(selfiePaths[0], 300); // valid for 5 minutes

        if (signError || !signedData) {
          throw new Error('Could not access uploaded selfie');
        }

        let imageUrl;
        try {
          imageUrl = await tryGenerate(signedData.signedUrl);
        } catch (firstErr) {
          imageUrl = await tryGenerate(signedData.signedUrl);
        }

        clearInterval(rotateInterval);
        sessionStorage.setItem('retropia_result_image', imageUrl);
        sessionStorage.setItem('retropia_result_theme', theme);
        window.location.href = 'result.html';
      } catch (err) {
        clearInterval(rotateInterval);
        sessionStorage.setItem('retropia_generation_error', String(err));
        window.location.href = 'generation-failed.html';
      }
    })();
  </script>
</body>
</html>
