<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #1C1C1C;
      border-radius: 24px;
      padding: 32px 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
      text-align: center;
    }
    .subtext {
      color: #B8B8B8;
      font-size: 15px;
      text-align: center;
      margin: 0 0 28px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #B8B8B8;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      height: 52px;
      background: #1C1C1C;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 0 16px;
      color: #fff;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #6C5CE7;
    }
    .primary-btn {
      width: 100%;
      height: 52px;
      background: #6C5CE7;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 24px;
      cursor: pointer;
    }
    .primary-btn:active { filter: brightness(0.92); }
    .divider {
      display: flex;
      align-items: center;
      color: #777;
      font-size: 13px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #2A2A2A;
    }
    .divider::before { margin-right: 12px; }
    .divider::after { margin-left: 12px; }
    .google-btn {
      width: 100%;
      height: 52px;
      background: #202020;
      border: 1px solid #303030;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }
    .switch-mode {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #B8B8B8;
    }
    .switch-mode a {
      color: #8B7CF0;
      text-decoration: none;
      font-weight: 600;
    }
    #status {
      text-align: center;
      font-size: 14px;
      margin-top: 16px;
      min-height: 18px;
    }
    .error { color: #EF5B5B; }
    .success { color: #35C98A; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="form-title">Welcome to Retropia</h1>
    <p class="subtext" id="form-subtext">Create your first era journey.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••">

    <button class="primary-btn" id="submit-btn" onclick="handleSubmit()">Continue</button>

    <div class="divider">or</div>

    <button class="google-btn" onclick="signInWithGoogle()">Continue with Google</button>

    <p class="switch-mode" id="switch-text">
      Already have an account? <a href="#" onclick="toggleMode(event)">Log in</a>
    </p>

    <p id="status"></p>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    let isSignUp = true;

    function toggleMode(e) {
      e.preventDefault();
      isSignUp = !isSignUp;
      document.getElementById('form-title').innerText = isSignUp ? "Welcome to Retropia" : "Welcome back";
      document.getElementById('form-subtext').innerText = isSignUp ? "Create your first era journey." : "Log in to continue your journey.";
      document.getElementById('submit-btn').innerText = "Continue";
      document.getElementById('switch-text').innerHTML = isSignUp
        ? 'Already have an account? <a href="#" onclick="toggleMode(event)">Log in</a>'
        : 'Don\'t have an account? <a href="#" onclick="toggleMode(event)">Sign up</a>';
      document.getElementById('status').innerText = '';
    }

    async function handleSubmit() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('status');
      statusEl.className = '';
      statusEl.innerText = '';

      if (!email || !password) {
        statusEl.className = 'error';
        statusEl.innerText = 'Please fill in both fields.';
        return;
      }

      statusEl.innerText = 'Please wait...';

      if (isSignUp) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          statusEl.className = 'error';
          statusEl.innerText = error.message;
        } else {
          statusEl.className = 'success';
          statusEl.innerText = 'Account created! Check your email to confirm, or you may already be signed in.';
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          statusEl.className = 'error';
          statusEl.innerText = error.message;
        } else {
          statusEl.className = 'success';
          statusEl.innerText = 'Logged in successfully!';
        }
      }
    }

    async function signInWithGoogle() {
      const { data, error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
      if (error) {
        document.getElementById('status').className = 'error';
        document.getElementById('status').innerText = error.message;
      }
    }
  </script>
</body>
</html>
