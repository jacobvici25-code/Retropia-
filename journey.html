<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Choose Your Journey</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      min-height: 100vh;
    }
    body { padding: 16px 20px 110px; }

    .top-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .top-logo img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }
    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: #1C1C1C;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
    }
    .header h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; }
    .progress { color: #777; font-size: 13px; }

    .subtext {
      color: #B8B8B8;
      font-size: 15px;
      margin: 12px 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .journey-card {
      background: #1C1C1C;
      border: 2px solid transparent;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease;
      position: relative;
    }
    .journey-card.selected {
      border-color: #6C5CE7;
      box-shadow: 0 0 20px rgba(108,92,231,0.35);
      transform: translateY(-2px);
    }
    .journey-card .check {
      position: absolute;
      top: 8px; right: 8px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #6C5CE7;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .journey-card.selected .check { display: flex; }
    .journey-img {
      height: 130px;
      background-size: cover;
      background-position: top center;
    }
    .journey-info { padding: 10px 12px 14px; }
    .journey-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .journey-range { font-size: 12px; color: #777; }

    .bottom-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #121212 65%, transparent);
    }
    .hint { text-align: center; font-size: 13px; color: #B8B8B8; margin-bottom: 8px; }
    .generate-btn {
      width: 100%;
      height: 52px;
      background: #6C5CE7;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .generate-btn:disabled { background: #2A2A2A; color: #666; }
  </style>
</head>
<body>
  <div class="top-logo">
    <img src="logo.png" alt="Retropia">
  </div>

  <div class="header">
    <a href="upload.html" class="back-btn">&larr;</a>
    <h1>Choose your journey</h1>
    <span class="progress">2 of 3</span>
  </div>
  <p class="subtext">Choose the story you want Retropia to create.</p>

  <div class="grid" id="grid"></div>

  <div class="bottom-bar">
    <div class="hint" id="hint">Your journey usually takes about 30–60 seconds.</div>
    <button class="generate-btn" id="generate-btn" disabled onclick="startGeneration()">Generate My Journey</button>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    const journeys = [
      { id: 'time-traveler', name: 'The Time Traveler', range: '1920s → 2090s', img: 'time-traveler.png' },
      { id: 'heros-journey', name: "The Hero's Journey", range: 'Ancient → Future', img: 'heros-journey.png' },
      { id: 'romantic', name: 'The Romantic', range: '1920s → 2090s', img: 'romantic.png' },
      { id: 'rebel', name: 'The Rebel', range: '1950s → Future', img: 'rebel.png' },
      { id: 'royal', name: 'The Royal', range: 'Medieval → Future', img: 'royal.png' },
      { id: 'genius', name: 'The Genius', range: '1800s → 2100s', img: 'genius.png' },
      { id: 'explorer', name: 'The Explorer', range: 'Age of Exploration → Space', img: 'explorer.png' },
      { id: 'artist', name: 'The Artist', range: 'Renaissance → Future', img: 'artist.png' },
      { id: 'celebrity', name: 'The Celebrity Evolution', range: 'Classic Hollywood → Future', img: 'celebrity.png' },
      { id: 'spirit', name: 'The Spirit', range: 'Ancient → Cosmic Future', img: 'spirit.png' },
    ];

    let selectedId = null;
    const grid = document.getElementById('grid');
    const generateBtn = document.getElementById('generate-btn');

    journeys.forEach(j => {
      const card = document.createElement('div');
      card.className = 'journey-card';
      card.id = 'card-' + j.id;
      card.onclick = () => selectJourney(j.id);
      card.innerHTML = `
        <div class="check">✓</div>
        <div class="journey-img" style="background-image:url('${j.img}')"></div>
        <div class="journey-info">
          <div class="journey-name">${j.name}</div>
          <div class="journey-range">${j.range}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    function selectJourney(id) {
      if (selectedId) {
        document.getElementById('card-' + selectedId).classList.remove('selected');
      }
      selectedId = id;
      document.getElementById('card-' + id).classList.add('selected');
      generateBtn.disabled = false;
    }

    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      const paths = sessionStorage.getItem('retropia_selfie_paths');
      if (!paths) {
        window.location.href = 'upload.html';
      }
    })();

    function startGeneration() {
      if (!selectedId) return;
      sessionStorage.setItem('retropia_selected_journey', selectedId);
      window.location.href = 'generating.html';
    }
  </script>
</body>
</html>
