<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Add Selfies</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      min-height: 100vh;
    }
    body { padding: 20px 20px 100px; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }
    .back-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: #1C1C1C;
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
    }
    .header h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; }
    .progress { color: #777; font-size: 13px; }

    /* Upload box */
    .upload-box {
      margin-top: 24px;
      border: 2px dashed #3A3A3A;
      border-radius: 18px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .upload-box .icon { font-size: 26px; }
    .upload-box .title { font-size: 15px; font-weight: 600; }
    .upload-box .sub { font-size: 13px; color: #777; }
    input[type="file"] { display: none; }

    /* Grid */
    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #1C1C1C;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .remove {
      position: absolute;
      top: 4px; right: 4px;
      width: 20px; height: 20px;
      background: rgba(0,0,0,0.7);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
    }
    .thumb .uploading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5);
      font-size: 11px;
      color: #B8B8B8;
    }

    .counter { margin-top: 14px; font-size: 14px; color: #B8B8B8; text-align: center; }

    .guidance {
      margin-top: 24px;
      background: #1C1C1C;
      border-radius: 14px;
      padding: 16px;
      font-size: 13px;
      color: #B8B8B8;
      line-height: 1.5;
    }
    .guidance strong { color: #fff; display: block; margin-bottom: 4px; font-size: 14px; }

    /* Sticky bottom action */
    .bottom-bar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #121212 60%, transparent);
    }
    .next-btn {
      width: 100%;
      height: 52px;
      background: #6C5CE7;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .next-btn:disabled {
      background: #2A2A2A;
      color: #666;
    }
    .hint { text-align: center; font-size: 13px; color: #F2B84B; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="dashboard.html" class="back-btn">&larr;</a>
    <h1>Add your selfies</h1>
    <span class="progress">1 of 3</span>
  </div>

  <label class="upload-box" for="file-input">
    <div class="icon">📷</div>
    <div class="title">Add photos</div>
    <div class="sub">Choose from your camera or gallery</div>
  </label>
  <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" multiple>

  <div class="grid" id="grid"></div>
  <div class="counter" id="counter">0 / 15 photos</div>

  <div class="guidance">
    <strong>For the best result</strong>
    Upload at least 3 clear selfies. 10–15 photos usually gives the best results.
  </div>

  <div class="bottom-bar">
    <div class="hint" id="hint">Add at least 3 photos to continue.</div>
    <button class="next-btn" id="next-btn" disabled onclick="goNext()">Next: Choose Your Era</button>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    const MIN_PHOTOS = 3;
    const MAX_PHOTOS = 15;
    let files = []; // { id, file, url, uploaded, path }

    const fileInput = document.getElementById('file-input');
    const grid = document.getElementById('grid');
    const counter = document.getElementById('counter');
    const nextBtn = document.getElementById('next-btn');
    const hint = document.getElementById('hint');

    let currentUser = null;
    (async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      currentUser = user;
    })();

    fileInput.addEventListener('change', (e) => {
      const selected = Array.from(e.target.files);
      const room = MAX_PHOTOS - files.length;
      const toAdd = selected.slice(0, room);

      toAdd.forEach(file => {
        const id = 'f' + Date.now() + Math.random().toString(36).slice(2, 7);
        const url = URL.createObjectURL(file);
        const entry = { id, file, url, uploaded: false };
        files.push(entry);
        renderThumb(entry);
        uploadFile(entry);
      });

      fileInput.value = '';
      updateCounter();
    });

    function renderThumb(entry) {
      const div = document.createElement('div');
      div.className = 'thumb';
      div.id = entry.id;
      div.innerHTML = `
        <img src="${entry.url}">
        <div class="uploading">Uploading...<br>a few seconds</div>
        <div class="remove" onclick="removeFile('${entry.id}')">✕</div>
      `;
      grid.appendChild(div);
    }

    async function uploadFile(entry) {
      if (!currentUser) return;
      const ext = entry.file.name.split('.').pop();
      const path = `${currentUser.id}/${entry.id}.${ext}`;
      const { data, error } = await supabaseClient.storage
        .from('Selfies')
        .upload(path, entry.file, { upsert: true });

      const thumbEl = document.getElementById(entry.id);
      if (error) {
        if (thumbEl) thumbEl.querySelector('.uploading').innerText = 'Failed';
        entry.uploaded = false;
      } else {
        entry.uploaded = true;
        entry.path = path;
        if (thumbEl) thumbEl.querySelector('.uploading').remove();
      }
      updateCounter();
    }

    function removeFile(id) {
      const idx = files.findIndex(f => f.id === id);
      if (idx === -1) return;
      const entry = files[idx];
      if (entry.path) {
        supabaseClient.storage.from('Selfies').remove([entry.path]);
      }
      files.splice(idx, 1);
      const el = document.getElementById(id);
      if (el) el.remove();
      updateCounter();
    }

    function updateCounter() {
      const count = files.length;
      counter.innerText = `${count} / ${MAX_PHOTOS} photos`;

      const allUploaded = files.every(f => f.uploaded);

      if (count === 0) {
        hint.innerText = `Add at least ${MIN_PHOTOS} photos to continue.`;
        nextBtn.disabled = true;
      } else if (count < MIN_PHOTOS) {
        const remaining = MIN_PHOTOS - count;
        hint.innerText = remaining === 1 ? '1 more photo to go!' : `${remaining} more photos to go!`;
        nextBtn.disabled = true;
      } else if (count >= MAX_PHOTOS) {
        hint.innerText = 'Maximum 15 photos.';
        nextBtn.disabled = !allUploaded;
      } else if (!allUploaded) {
        hint.innerText = 'Finishing upload...';
        nextBtn.disabled = true;
      } else {
        hint.innerText = '';
        nextBtn.disabled = false;
      }

      // disable the picker once max reached
      fileInput.parentElement === document.querySelector('.upload-box');
      document.querySelector('.upload-box').style.opacity = count >= MAX_PHOTOS ? '0.4' : '1';
      document.querySelector('.upload-box').style.pointerEvents = count >= MAX_PHOTOS ? 'none' : 'auto';
    }

    function goNext() {
      const paths = files.filter(f => f.uploaded).map(f => f.path);
      sessionStorage.setItem('retropia_selfie_paths', JSON.stringify(paths));
      window.location.href = 'journey.html';
    }
  </script>
</body>
</html>
