<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retropia - Something Went Wrong</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 40px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
    p { font-size: 14px; color: #B8B8B8; max-width: 300px; margin: 0 0 28px; }
    .btn {
      width: 100%; max-width: 300px;
      height: 50px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      cursor: pointer;
      text-decoration: none;
      display: flex; align-items: center; justify-content: center;
    }
    .primary { background: #6C5CE7; color: #fff; border: none; }
    .secondary { background: #1C1C1C; color: #fff; border: 1px solid #2A2A2A; }
  </style>
</head>
<body>
  <div class="icon">😕</div>
  <h1>Something went wrong</h1>
  <p>We couldn't create your journey this time. Let's try again.</p>
  <a href="journey.html" class="btn primary">Try Again</a>
  <a href="upload.html" class="btn secondary">Back to Upload</a>
</body>
</html>
